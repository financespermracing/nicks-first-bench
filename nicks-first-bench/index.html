<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nicks first bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Teal title bar -->
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Question list" title="Question list">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    </button>
    <h1 id="quizTitle"></h1>
  </header>

  <!-- Grey toolbar -->
  <nav class="toolbar">
    <div class="left">
      <button class="icon-btn" id="homeBtn" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>
      <button class="icon-btn" id="overviewBtn" aria-label="Overview" title="Overview">
        <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
      </button>
      <button class="crumb" id="crumbBtn" title="Back to overview">
        <svg viewBox="0 0 24 24"><path d="M9 4 4 9h4v11h12v-2H10V9h4z"/></svg>
        <strong id="crumbBold"></strong>
        <span id="crumbRest"></span>
      </button>
    </div>
    <div class="right">
      <button class="icon-btn" id="translateBtn" aria-label="Translate" title="Translate">
        <svg viewBox="0 0 24 24"><path d="m12.87 15.07-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7 1.62-4.33L19.12 17h-3.24z"/></svg>
      </button>
      <button class="icon-btn" id="speakBtn" aria-label="Read aloud" title="Read aloud">
        <svg viewBox="0 0 24 24"><path d="M9 13c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm7.76-9.64-1.68 1.69c.84 1.18.84 2.71 0 3.89l1.68 1.69c2.02-2.02 2.02-5.07 0-7.27zM20.07 2l-1.63 1.63c2.77 3.02 2.77 7.56 0 10.74L20.07 16c3.9-3.89 3.91-9.95 0-14z"/></svg>
      </button>
      <button class="icon-btn" id="printBtn" aria-label="Print" title="Print">
        <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      </button>
      <button class="icon-btn" id="helpBtn" aria-label="Help" title="Help">
        <svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
      </button>
    </div>
  </nav>

  <main>
    <section class="question" id="view" aria-live="polite"></section>
  </main>

  <!-- Bottom navigation -->
  <footer class="bottombar">
    <button class="nav-btn" id="prevBtn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      PREVIOUS
    </button>
    <button class="nav-btn" id="nextBtn">
      NEXT
      <svg viewBox="0 0 24 24"><path d="m12 4-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </button>
  </footer>

  <!-- Question list drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Questions">
    <div class="drawer-head">Questions</div>
    <ol id="drawerList"></ol>
  </aside>

  <!-- Help dialog -->
  <dialog id="helpDialog">
    <h2>How this works</h2>
    <ul>
      <li>Pick an answer, then press <b>Submit</b>.</li>
      <li>Use <b>Previous</b> / <b>Next</b> or the ☰ menu to move between questions.</li>
      <li>Keyboard: <b>A–D</b> picks an answer, <b>Enter</b> submits, <b>←/→</b> moves.</li>
      <li>The speaker icon reads the question aloud; the printer icon prints it.</li>
    </ul>
    <form method="dialog"><button class="submit">CLOSE</button></form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
